apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "release-radar.fullname" . }}-api
  labels:
    {{- include "release-radar.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "release-radar.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "release-radar.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: api
      annotations:
        {{- toYaml .Values.podAnnotations | nindent 8 }}
    spec:
      serviceAccountName: {{ include "release-radar.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: {{ include "release-radar.fullname" . }}
          env:
            - name: ASPNETCORE_URLS
              value: http://+:8080
            - name: ConnectionStrings__ReleaseRadar
              valueFrom:
                secretKeyRef:
                  name: {{ include "release-radar.secretName" . }}
                  key: connection-string
            - name: Integrations__ArgoCd__Token
              valueFrom:
                secretKeyRef:
                  name: {{ include "release-radar.secretName" . }}
                  key: argocd-token
                  optional: true
            - name: Integrations__GitHub__Token
              valueFrom:
                secretKeyRef:
                  name: {{ include "release-radar.secretName" . }}
                  key: github-token
                  optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 8
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "release-radar.fullname" . }}-api
  labels:
    {{- include "release-radar.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "release-radar.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
