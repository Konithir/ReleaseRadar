{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "release-radar.fullname" . }}
  labels:
    {{- include "release-radar.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "release-radar.fullname" . }}-api
                port:
                  number: {{ .Values.api.service.port }}
          - path: /hubs
            pathType: Prefix
            backend:
              service:
                name: {{ include "release-radar.fullname" . }}-api
                port:
                  number: {{ .Values.api.service.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "release-radar.fullname" . }}-web
                port:
                  number: {{ .Values.web.service.port }}
{{- end }}
