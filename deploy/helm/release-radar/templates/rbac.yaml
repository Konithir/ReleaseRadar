{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "release-radar.serviceAccountName" . }}
  labels:
    {{- include "release-radar.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.serviceAccount.annotations | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "release-radar.fullname" . }}-reader
rules:
  - apiGroups: ["", "apps", "batch"]
    resources: ["pods", "namespaces", "deployments", "replicasets", "statefulsets", "daemonsets", "jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "release-radar.fullname" . }}-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "release-radar.fullname" . }}-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "release-radar.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
