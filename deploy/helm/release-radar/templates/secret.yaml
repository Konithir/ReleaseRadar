{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "release-radar.fullname" . }}
  labels:
    {{- include "release-radar.labels" . | nindent 4 }}
type: Opaque
stringData:
  connection-string: {{ required "secrets.connectionString is required when secrets.create=true" .Values.secrets.connectionString | quote }}
  argocd-token: {{ .Values.secrets.argoCdToken | quote }}
  github-token: {{ .Values.secrets.githubToken | quote }}
{{- end }}
