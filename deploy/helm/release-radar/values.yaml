nameOverride: ""
fullnameOverride: ""

api:
  replicaCount: 2
  image:
    repository: ghcr.io/example/release-radar-api
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      cpu: 500m
      memory: 512Mi

web:
  replicaCount: 2
  image:
    repository: ghcr.io/example/release-radar-web
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 192Mi

config:
  databaseProvider: SqlServer
  otlpEndpoint: http://otel-collector.monitoring.svc:4317
  argoCd:
    enabled: true
    baseUrl: http://argocd-server.argocd.svc
  kubernetes:
    enabled: true
    baseUrl: https://kubernetes.default.svc
  prometheus:
    enabled: true
    baseUrl: http://prometheus-server.monitoring.svc
  github:
    enabled: true
    baseUrl: https://api.github.com

secrets:
  create: false
  connectionString: ""
  argoCdToken: ""
  githubToken: ""
  existingSecret: release-radar-secrets

ingress:
  enabled: false
  className: nginx
  host: release-radar.example.com
  tls: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: /metrics

